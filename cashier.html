<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Cafe POS</title>
  <style>
    *{box-sizing:border-box} body{margin:0;font:15px system-ui,sans-serif;background:#f4f6f8;color:#17212b} header{height:58px;padding:12px 18px;background:#182532;color:#fff;display:flex;gap:16px;align-items:center} header strong{font-size:19px} #user{margin-left:auto}.app{display:grid;grid-template-columns:260px 320px 1fr;min-height:calc(100vh - 58px);gap:1px;background:#d9e0e6}.panel{background:#fff;padding:14px;overflow:auto}.table,.dish,.item,.bill{border:1px solid #d8e0e6;border-radius:8px;margin:8px 0;padding:10px;background:#fff}.table{cursor:pointer}.table.busy{border-left:6px solid #e86b5c}.table.free{border-left:6px solid #55a978}.table.selected{background:#e7f1ff}.dish{cursor:pointer}.dish:hover{background:#f1f7ff}.row{display:flex;justify-content:space-between;gap:8px;align-items:center}.muted{color:#647482;font-size:13px} button{border:0;border-radius:6px;padding:8px 11px;background:#276fbf;color:white;cursor:pointer}button.secondary{background:#607080}button.danger{background:#c23d3d}button:disabled{opacity:.5;cursor:not-allowed}input,select{width:100%;padding:9px;border:1px solid #b9c5cf;border-radius:6px;margin:5px 0}.login{max-width:360px;margin:14vh auto;background:white;padding:24px;border-radius:10px;box-shadow:0 5px 22px #0002}.hidden{display:none}h2,h3{margin:4px 0 12px}.total{font-size:22px;font-weight:700;margin:16px 0}.actions{display:flex;flex-wrap:wrap;gap:8px}.qty{display:flex;gap:5px;align-items:center}.qty button{padding:3px 8px}.notice{color:#bf3333;margin-top:8px}@media(max-width:800px){.app{grid-template-columns:1fr}.panel{min-height:220px}}
  </style>
</head>
<body>
  <section id="loginView" class="login"><h2>Вход в Cafe POS</h2><input id="login" placeholder="Логин" autocomplete="username"><input id="password" type="password" placeholder="Пароль" autocomplete="current-password"><button id="loginButton">Войти</button><div id="loginError" class="notice"></div><p class="muted">Первого администратора создайте запросом POST /auth/register после установки базы.</p></section>
  <main id="posView" class="hidden"><header><strong>Cafe POS</strong><span id="orderTitle">Выберите стол</span><span id="user"></span><button class="secondary" id="logout">Выйти</button></header><section class="app"><aside class="panel"><h3>Столы</h3><div id="tables"></div></aside><aside class="panel"><h3>Меню</h3><div id="menu"></div></aside><section class="panel"><div id="order"><p class="muted">Выберите свободный стол, чтобы создать заказ, или занятый — чтобы открыть его.</p></div></section></section></main>
<script>
const apiBase = location.origin === 'null' ? 'http://localhost:3000' : location.origin;
let token = localStorage.getItem('cafe_token'), user = JSON.parse(localStorage.getItem('cafe_user') || 'null'), currentOrder = null, currentTable = null, menu = [], categories = [], selectedCategoryId = localStorage.getItem('cafe_selected_category') || 'all', latestTables = [];
const $ = id => document.getElementById(id); const money = v => new Intl.NumberFormat('ru-RU',{style:'currency',currency:'KZT',maximumFractionDigits:2}).format(Number(v));
async function api(path, options={}) { const response = await fetch(apiBase+path,{...options,headers:{'Content-Type':'application/json',Authorization:'Bearer '+token,...options.headers}}); const data = await response.json().catch(()=>({})); if(!response.ok) throw new Error(data.error||'Ошибка запроса'); return data; }
function setLoginState(){ $('loginView').classList.toggle('hidden',!!token); $('posView').classList.toggle('hidden',!token); if(token){$('user').textContent=user.name+' · '+user.role; loadAll();} }
$('loginButton').onclick=async()=>{try{const data=await api('/auth/login',{method:'POST',headers:{},body:JSON.stringify({login:$('login').value,password:$('password').value})}); token=data.token;user=data.user;localStorage.setItem('cafe_token',token);localStorage.setItem('cafe_user',JSON.stringify(user));$('loginError').textContent='';setLoginState();}catch(e){$('loginError').textContent=e.message;}};
$('logout').onclick=()=>{localStorage.clear();token=null;user=null;currentOrder=null;setLoginState();};
async function loadAll(){await Promise.all([loadTables(),loadMenu()]);}
async function loadTables(){const tables=await api('/tables');const root=$('tables');root.replaceChildren();tables.forEach(t=>{const el=document.createElement('div');el.className='table '+t.status+(currentTable?.id===t.id?' selected':'');el.innerHTML='<div class="row"><b></b><span class="muted"></span></div>';el.querySelector('b').textContent=t.name;el.querySelector('span').textContent=t.status==='busy'?'Заказ #'+t.open_order_id:'Свободен';el.onclick=()=>selectTable(t);root.append(el);});}
async function loadMenu(){menu=await api('/menu');const root=$('menu');root.replaceChildren();menu.forEach(d=>{const el=document.createElement('div');el.className='dish';el.innerHTML='<div class="row"><b></b><span></span></div><div class="muted"></div>';el.querySelector('b').textContent=d.name;el.querySelector('span').textContent=money(d.price);el.querySelector('.muted').textContent=d.category||'Без категории';el.onclick=()=>addDish(d);root.append(el);});}
async function selectTable(table){currentTable=table;await loadTables();if(table.open_order_id){await loadOrder(table.open_order_id);return;} currentOrder=null;$('orderTitle').textContent=table.name;$('order').replaceChildren();const text=document.createElement('p');text.textContent=table.name+' свободен.';const btn=document.createElement('button');btn.textContent='Создать заказ';btn.onclick=createOrder;$('order').append(text,btn);}
async function createOrder(){try{const guests=Number(prompt('Количество гостей','1'))||1;const data=await api('/orders',{method:'POST',body:JSON.stringify({table_id:currentTable.id,guest_count:guests})});currentOrder=data;renderOrder();await loadTables();}catch(e){alert(e.message);}}
async function loadOrder(id){try{currentOrder=await api('/orders/'+id);renderOrder();}catch(e){alert(e.message);}}
async function addDish(dish){if(!currentOrder?.order||currentOrder.order.status!=='open')return alert('Сначала создайте открытый заказ.');try{currentOrder=await api('/orders/'+currentOrder.order.id+'/items',{method:'POST',body:JSON.stringify({menu_item_id:dish.id,quantity:1})});renderOrder();}catch(e){alert(e.message);}}
function button(label,fn,cls=''){const b=document.createElement('button');b.textContent=label;b.className=cls;b.onclick=fn;return b;}
function renderOrder(){const root=$('order');root.replaceChildren();if(!currentOrder?.order)return;const o=currentOrder.order;$('orderTitle').textContent=`${o.table_name} · Заказ #${o.id}`;root.append(Object.assign(document.createElement('h2'),{textContent:`Заказ #${o.id}`}));const meta=document.createElement('p');meta.className='muted';meta.textContent=`${o.waiter_name} · гостей: ${o.guest_count} · ${o.status}`;root.append(meta);currentOrder.items.filter(i=>i.status==='active').forEach(i=>{const el=document.createElement('div');el.className='item';const row=document.createElement('div');row.className='row';const name=document.createElement('b');name.textContent=i.name;const sum=document.createElement('span');sum.textContent=money(i.quantity*i.price);row.append(name,sum);const control=document.createElement('div');control.className='row';const qty=document.createElement('div');qty.className='qty';qty.append(button('−',()=>setQty(i,i.quantity-1)),Object.assign(document.createElement('span'),{textContent:i.quantity+' × '+money(i.price)}),button('+',()=>setQty(i,i.quantity+1)));control.append(qty);if(['admin','manager'].includes(user.role))control.append(button('Отмена',()=>cancelItem(i),'danger'));el.append(row,control);root.append(el);});const total=Object.assign(document.createElement('div'),{className:'total',textContent:'Итого: '+money(o.total)});root.append(total);if(o.status==='open'){const actions=document.createElement('div');actions.className='actions';actions.append(button('Оплата наличными',()=>pay('cash')),button('Оплата картой',()=>pay('card')),button('Разделить счёт',split));if(['admin','manager'].includes(user.role))actions.append(button('Отменить заказ',cancelOrder,'danger'));root.append(actions);}if(currentOrder.bills?.length){root.append(Object.assign(document.createElement('h3'),{textContent:'Разделённые счета'}));currentOrder.bills.forEach(b=>{const e=document.createElement('div');e.className='bill row';e.append(Object.assign(document.createElement('span'),{textContent:'Счёт #'+b.id+' — '+money(b.amount)+' ('+b.status+')'}));if(b.status==='open')e.append(button('Оплатить',()=>pay('cash',b.id,b.amount)));root.append(e);});}}
async function setQty(item,quantity){if(quantity<1)return;try{currentOrder=await api(`/orders/${currentOrder.order.id}/items/${item.id}`,{method:'PATCH',body:JSON.stringify({quantity})});renderOrder();}catch(e){alert(e.message);}}
async function cancelItem(item){const reason=prompt('Причина отмены');if(!reason)return;try{currentOrder=await api(`/orders/${currentOrder.order.id}/items/${item.id}/cancel`,{method:'POST',body:JSON.stringify({reason})});renderOrder();}catch(e){alert(e.message);}}
async function cancelOrder(){const reason=prompt('Причина отмены заказа');if(!reason)return;try{currentOrder=await api(`/orders/${currentOrder.order.id}/cancel`,{method:'POST',body:JSON.stringify({reason})});renderOrder();await loadTables();}catch(e){alert(e.message);}}
async function split(){const count=Number(prompt('На сколько равных частей разделить счёт?','2'));if(!count)return;try{currentOrder=await api(`/orders/${currentOrder.order.id}/split`,{method:'POST',body:JSON.stringify({count})});renderOrder();}catch(e){alert(e.message);}}
async function pay(method,billId=null,amount=null){const value=amount||Number(currentOrder.order.total)-currentOrder.payments.reduce((s,p)=>s+Number(p.amount),0);if(!confirm(`Принять ${money(value)} (${method})?`))return;try{currentOrder=await api(`/orders/${currentOrder.order.id}/payments`,{method:'POST',body:JSON.stringify({method,amount:value,bill_id:billId})});renderOrder();await loadTables();}catch(e){alert(e.message);}}
function ensureCategoryNav(){
  let root=$('categoryNav');
  if(root)return root;
  const menuRoot=$('menu');
  root=document.createElement('div');root.id='categoryNav';root.className='category-nav';
  menuRoot.before(root);
  if(!document.getElementById('categoryNavStyle')){
    const style=document.createElement('style');style.id='categoryNavStyle';
    style.textContent='.category-nav{display:flex;gap:6px;overflow:auto;padding:2px 0 8px}.category-nav button{white-space:nowrap;background:#e9eef2;color:#17212b}.category-nav button.active{background:#276fbf;color:#fff}';
    document.head.append(style);
  }
  return root;
}
function ensureMenuSearch(){
  let input=$('menuSearch');if(input)return input;
  input=document.createElement('input');input.id='menuSearch';input.type='search';input.placeholder='Поиск блюд';input.autocomplete='off';
  input.addEventListener('input',renderMenu);ensureCategoryNav().before(input);return input;
}
async function loadMenu(){
  const data=await Promise.all([api('/menu'),api('/menu/categories')]);
  menu=data[0];categories=data[1];renderCategoryNav();renderMenu();
}
function renderCategoryNav(){
  const root=ensureCategoryNav();root.replaceChildren();
  [{id:'all',name:'\u0412\u0441\u0435'},{id:'quick',name:'\u0411\u044b\u0441\u0442\u0440\u043e\u0435 \u043c\u0435\u043d\u044e'},...categories].forEach(category=>{
    const el=button(category.name,()=>{selectedCategoryId=category.id;localStorage.setItem('cafe_selected_category',selectedCategoryId);renderCategoryNav();renderMenu();});
    el.classList.toggle('active',String(selectedCategoryId)===String(category.id));root.append(el);
  });
}
function renderMenu(){
  const root=$('menu'), search=ensureMenuSearch().value.trim().toLocaleLowerCase();root.replaceChildren();
  menu.filter(d=>(selectedCategoryId==='all'||(selectedCategoryId==='quick'&&d.is_quick)||String(d.category_id)===String(selectedCategoryId))&&(!search||d.name.toLocaleLowerCase().includes(search))).forEach(d=>{
    const el=document.createElement('div');el.className='dish';
    el.innerHTML='<div class="row"><b></b><span></span></div><div class="muted"></div>';
    el.querySelector('b').textContent=d.name;el.querySelector('span').textContent=money(d.price);
    el.querySelector('.muted').textContent=d.category||'\u0411\u0435\u0437 \u043a\u0430\u0442\u0435\u0433\u043e\u0440\u0438\u0438';el.onclick=()=>addDish(d);
    if(['admin','manager'].includes(user?.role)){const quick=button(d.is_quick?'\u0423\u0431\u0440\u0430\u0442\u044c \u0438\u0437 \u0431\u044b\u0441\u0442\u0440\u043e\u0433\u043e':'\u0412 \u0431\u044b\u0441\u0442\u0440\u043e\u0435',event=>toggleQuickDish(event,d),'secondary');quick.style.marginTop='8px';el.append(quick);}root.append(el);
  });
}
async function toggleQuickDish(event,dish){event.stopPropagation();try{await api(`/menu/${dish.id}`,{method:'PATCH',body:JSON.stringify({is_quick:!dish.is_quick})});await loadMenu();}catch(e){alert(e.message);}}
function ensureStaffButton(){
  if(user?.role!=='admin')return;let el=$('staffButton');if(el)return;
  el=document.createElement('button');el.id='staffButton';el.className='secondary';el.textContent='Официанты';el.onclick=openStaffPage;$('logout').before(el);
}
async function openStaffPage(){
  const overlay=document.createElement('div');overlay.className='staff-page';const box=document.createElement('section');box.className='staff-box';overlay.append(box);document.body.append(overlay);
  const close=button('Закрыть',()=>overlay.remove(),'secondary');const title=document.createElement('h2');title.textContent='Сотрудники';
  const form=document.createElement('form');form.className='staff-form';
  const fields=[['name','Имя'],['login','Логин'],['password','Пароль (минимум 8 символов)']];const values={};
  fields.forEach(([key,label])=>{const input=document.createElement('input');input.name=key;input.placeholder=label;input.type=key==='password'?'password':'text';input.required=true;values[key]=input;form.append(input);});
  const role=document.createElement('select');role.name='role';[['waiter','Официант'],['cashier','Кассир'],['manager','Менеджер'],['admin','Администратор']].forEach(([value,label])=>{const option=new Option(label,value);role.append(option);});form.append(role);
  form.append(button('Добавить сотрудника',async event=>{event.preventDefault();try{await api('/auth/register',{method:'POST',body:JSON.stringify({name:values.name.value,login:values.login.value,password:values.password.value,role:role.value})});await fillStaffList(list);}catch(e){alert(e.message);}}));
  const list=document.createElement('div');box.append(title,close,form,list);await fillStaffList(list);
}
async function fillStaffList(root){
  const users=await api('/auth/users');root.replaceChildren();users.forEach(employee=>{
    const row=document.createElement('div');row.className='staff-row';const text=document.createElement('span');text.textContent=`${employee.name} · ${employee.login} · ${employee.role} · ${employee.active?'работает':'уволен'}`;row.append(text);
    if(employee.id!==user.id){row.append(button(employee.active?'Уволить':'Вернуть',async()=>{try{await api(`/auth/users/${employee.id}`,{method:'PATCH',body:JSON.stringify({active:!employee.active})});await fillStaffList(root);}catch(e){alert(e.message);}},employee.active?'danger':'secondary'));}root.append(row);
  });
}
const staffStyle=document.createElement('style');staffStyle.textContent='.staff-page{position:fixed;inset:0;background:#0006;z-index:10;overflow:auto;padding:6vh 16px}.staff-box{background:#fff;border-radius:10px;padding:20px;max-width:700px;margin:auto}.staff-form{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:6px;margin:12px 0}.staff-row{display:flex;justify-content:space-between;gap:10px;align-items:center;border-top:1px solid #d8e0e6;padding:8px 0}@media(max-width:600px){.staff-form{grid-template-columns:1fr}.staff-row{align-items:flex-start;flex-direction:column}}';document.head.append(staffStyle);
let activeShift=null;
function ensureShiftButton(){
  let el=$('shiftButton');if(el)return el;
  el=document.createElement('button');el.id='shiftButton';el.className='secondary';
  $('logout').before(el);return el;
}
async function loadShift(){
  if(!['admin','manager','cashier'].includes(user?.role))return;
  const data=await api('/shifts/current');activeShift=data.shift;const el=ensureShiftButton();
  el.textContent=activeShift?'Закрыть смену':'Открыть смену';el.onclick=activeShift?closeShift:openShift;
}
async function openShift(){
  const openingCash=Number(prompt('Сумма в кассе при открытии смены','0'));
  if(!Number.isFinite(openingCash)||openingCash<0)return;
  try{await api('/shifts/open',{method:'POST',body:JSON.stringify({opening_cash:openingCash})});await loadShift();}
  catch(e){alert(e.message);}
}
async function closeShift(){
  const closingCash=Number(prompt('Фактическая сумма наличных в кассе','0'));
  if(!Number.isFinite(closingCash)||closingCash<0)return;
  try{const data=await api(`/shifts/${activeShift.id}/close`,{method:'POST',body:JSON.stringify({closing_cash:closingCash})});alert(`Смена закрыта. Продажи: ${money(data.shift.sales.total)}`);await loadShift();}
  catch(e){alert(e.message);}
}
async function loadTables(){
  const tables=await api('/tables');latestTables=tables;const root=$('tables');root.replaceChildren();
  tables.forEach(t=>{
    const el=document.createElement('div');el.className='table '+t.status+(currentTable?.id===t.id?' selected':'');
    const row=document.createElement('div');row.className='row';const name=document.createElement('b');name.textContent=t.name;
    const status=document.createElement('span');status.className='muted';status.textContent=t.status==='busy'?`Заказ #${t.open_order_id}`:'Свободен';row.append(name,status);el.append(row);
    if(['admin','manager'].includes(user?.role)){
      const rename=button('Переименовать',event=>{event.stopPropagation();renameTable(t);},'secondary');rename.style.marginTop='8px';el.append(rename);
    }
    el.onclick=()=>selectTable(t);root.append(el);
  });
}
async function renameTable(table){
  const name=prompt('Новое название стола',table.name);if(!name?.trim()||name.trim()===table.name)return;
  try{await api(`/tables/${table.id}`,{method:'PATCH',body:JSON.stringify({name:name.trim()})});if(currentTable?.id===table.id)currentTable={...currentTable,name:name.trim()};await loadTables();}
  catch(e){alert(e.message);}
}
const selectTableBase=selectTable;
selectTable=async function(table){localStorage.setItem('cafe_selected_table_id',table.id);return selectTableBase(table);};
const submitPayment=pay;
function chooseCardPayment(){
  return new Promise(resolve=>{
    const overlay=document.createElement('div');overlay.className='payment-choice';
    const box=document.createElement('div');box.className='payment-choice-box';
    const title=document.createElement('h3');title.textContent='Способ оплаты картой';
    const qr=button('QR',()=>finish('online'));const card=button('Карта',()=>finish('card'));const cancel=button('Отмена',()=>finish(null),'secondary');
    function finish(method){overlay.remove();resolve(method);} box.append(title,qr,card,cancel);overlay.append(box);document.body.append(overlay);
  });
}
pay=async function(method,billId=null,amount=null){
  if(method==='card'){const selected=await chooseCardPayment();if(!selected)return;return submitPayment(selected,billId,amount);}
  return submitPayment(method,billId,amount);
};
const paymentStyle=document.createElement('style');paymentStyle.textContent='.payment-choice{position:fixed;inset:0;background:#0006;display:grid;place-items:center;z-index:10}.payment-choice-box{background:#fff;border-radius:10px;padding:20px;display:flex;gap:8px;flex-wrap:wrap;max-width:340px}.payment-choice-box h3{width:100%}';document.head.append(paymentStyle);
async function loadAll(){
  await Promise.all([loadTables(),loadMenu(),loadShift()]);
  ensureStaffButton();
  const savedId=localStorage.getItem('cafe_selected_table_id');
  if(!currentTable&&savedId){const savedTable=latestTables.find(table=>String(table.id)===savedId);if(savedTable)await selectTable(savedTable);}
}
$('logout').onclick=async()=>{
  try{await api('/auth/logout',{method:'POST'});}catch(_){}
  localStorage.clear();token=null;user=null;currentOrder=null;currentTable=null;activeShift=null;setLoginState();
};
setLoginState();
</script></body></html>
