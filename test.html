<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <title>Socket Test</title>
</head>
<body>
  <h2>Socket test</h2>

  <script src="https://cdn.socket.io/4.7.5/socket.io.min.js"></script>

  <script>
    const socket = io("http://localhost:3000");

    socket.on("connect", () => {
      console.log("CONNECTED:", socket.id);
      document.body.innerHTML += "<p>Connected: " + socket.id + "</p>";
    });

    socket.on("table:update", (data) => {
      console.log("TABLE:", data);
      document.body.innerHTML += "<p>TABLE UPDATE: " + JSON.stringify(data) + "</p>";
    });

    socket.on("order:update", (data) => {
      console.log("ORDER:", data);
      document.body.innerHTML += "<p>ORDER UPDATE: " + JSON.stringify(data) + "</p>";
    });

    socket.on("order:closed", (data) => {
      console.log("CLOSED:", data);
      document.body.innerHTML += "<p>CLOSED: " + JSON.stringify(data) + "</p>";
    });
  </script>
</body>
</html>
