<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Cafe POS — демо</title>
  <style>
    :root{--ink:#24313b;--green:#32866e;--cream:#fbf8f1;--line:#e7e0d3;--orange:#db8748}*{box-sizing:border-box}body{margin:0;font:15px Inter,system-ui,sans-serif;color:var(--ink);background:var(--cream)}header{min-height:66px;padding:10px 5%;background:#24313b;color:#fff;display:flex;align-items:center;gap:10px;flex-wrap:wrap}header strong{font-size:21px;letter-spacing:.3px}header .tag{font-size:12px;color:#c7d4cf;border:1px solid #6b797f;padding:4px 8px;border-radius:99px}header .user{margin-left:auto;color:#d9e8e3}.layout{display:grid;grid-template-columns:250px minmax(290px,360px) 1fr;gap:18px;padding:24px max(5%,24px);min-height:calc(100vh - 66px)}.panel{background:#fff;border:1px solid var(--line);border-radius:14px;padding:16px;box-shadow:0 6px 22px #2f28130b}h2,h3{margin:0 0 13px}h2{font-size:21px}h3{font-size:16px}.sub{color:#768078;font-size:13px;margin:-7px 0 13px}.table,.dish,.order-item{border:1px solid var(--line);border-radius:10px;margin:9px 0;padding:11px;cursor:pointer}.table:hover,.dish:hover{border-color:var(--green);background:#f5fbf8}.table.active{outline:2px solid #a8d7c6}.table .top,.dish .top,.order-item .top{display:flex;justify-content:space-between;gap:8px}.status{font-size:12px;padding:3px 7px;border-radius:99px;background:#e6f5ee;color:#237158}.status.busy{background:#fcebdd;color:#b75b21}.dish{cursor:pointer}.dish small{display:block;color:#758078;margin-top:4px}.price{font-weight:700;color:#3f6f5f}.empty{color:#77827e;line-height:1.5}.order-head{display:flex;justify-content:space-between;align-items:flex-start}.total{border-top:1px dashed var(--line);padding-top:15px;margin-top:15px;font-size:21px;font-weight:800;display:flex;justify-content:space-between}.actions{display:flex;flex-wrap:wrap;gap:8px;margin-top:15px}button{appearance:none;border:0;border-radius:8px;background:var(--green);padding:9px 12px;color:#fff;font-weight:650;cursor:pointer}button:hover{filter:brightness(.94)}button.light{background:#e9f2ee;color:#276852}button.warn{background:var(--orange)}button.ghost{background:transparent;color:#fff;border:1px solid #617077;padding:7px 10px}input{width:100%;padding:10px;border:1px solid var(--line);border-radius:8px;margin:5px 0 10px;font:inherit}.add{display:flex;gap:7px;margin-top:14px}.add input{margin:0}.login{width:min(390px,calc(100% - 32px));margin:15vh auto;background:#fff;padding:28px;border-radius:16px;border:1px solid var(--line);box-shadow:0 16px 48px #322a1c20}.login h1{margin-top:0}.hint{color:#66716d;font-size:13px}.error{color:#b44235;min-height:20px}.hidden{display:none!important}.quantity{display:flex;align-items:center;gap:8px;margin-top:9px}.quantity button{padding:3px 9px;background:#e9f2ee;color:#276852}.modal-backdrop{position:fixed;inset:0;background:#17212b99;display:grid;place-items:center;padding:18px;z-index:5}.modal{width:min(430px,100%);background:#fff;border-radius:16px;padding:22px;box-shadow:0 20px 60px #0005}.modal h2{margin-top:0}.modal-actions{display:flex;justify-content:flex-end;gap:9px;margin-top:16px}@media(max-width:850px){.layout{grid-template-columns:1fr}.panel{min-height:auto}}@media(max-width:520px){header .user{margin-left:0;order:3;width:100%}.layout{padding:12px}.panel{padding:13px}.login{margin:8vh auto}.table,.dish{padding:12px}}
  </style>
</head>
<body>
  <section id="loginView" class="login"><h1>Cafe POS</h1><p class="hint">Демонстрационная версия для показа</p><label>Логин</label><input id="login" value="admin" autocomplete="username"><label>Пароль</label><input id="password" type="password" value="admin" autocomplete="current-password"><button id="signIn">Войти</button><p id="loginError" class="error"></p><p class="hint">Администратор: <b>admin / admin</b><br>Официант: <b>waiter / waiter</b></p></section>
  <main id="app" class="hidden"><header><strong>☕ Cafe POS</strong><span class="tag">ДЕМО-РЕЖИМ</span><span class="user" id="user"></span><button class="ghost admin-only" id="history">История</button><button class="ghost admin-only" id="reports">Отчёты</button><button class="ghost admin-only" id="reset">Сбросить демо</button><button class="ghost" id="logout">Выйти</button></header><div class="layout"><aside class="panel"><h3>Столы</h3><p class="sub">Выберите стол для заказа</p><div id="tables"></div><div class="add admin-only"><input id="newTable" placeholder="Например, Стол 7"><button id="addTable">+</button></div></aside><aside class="panel"><h3>Меню</h3><p class="sub">Нажмите на блюдо, чтобы добавить</p><div id="menu"></div><div class="add admin-only"><input id="newDish" placeholder="Новое блюдо"><input id="newPrice" inputmode="decimal" placeholder="Цена"><button id="addDish">+</button></div></aside><section class="panel"><div id="order"></div></section></div></main>
  <div id="modal" class="modal-backdrop hidden"><section class="modal"><h2 id="modalTitle"></h2><div id="modalBody"></div><div id="modalActions" class="modal-actions"></div></section></div>
<script>
const initial={tables:[{id:1,name:'Стол 1'},{id:2,name:'Стол 2'},{id:3,name:'Стол 3'},{id:4,name:'Терраса 1'}],menu:[{id:1,name:'Капучино',price:180,category:'Кофе'},{id:2,name:'Латте',price:210,category:'Кофе'},{id:3,name:'Цезарь с курицей',price:490,category:'Салаты'},{id:4,name:'Паста карбонара',price:550,category:'Горячее'},{id:5,name:'Чизкейк',price:290,category:'Десерты'}],orders:[{id:101,tableId:2,items:[{menuId:1,quantity:2},{menuId:5,quantity:1}],status:'open',openedAt:Date.now()}]};
const $=id=>document.getElementById(id),money=n=>new Intl.NumberFormat('ru-RU',{style:'currency',currency:'KGS',maximumFractionDigits:0}).format(n);let state,selected=null,currentUser=null;
function closeModal(){$('modal').classList.add('hidden')}function modal(title,body,buttons=[['Закрыть','light',closeModal]]){$('modalTitle').textContent=title;$('modalBody').innerHTML=body;const root=$('modalActions');root.replaceChildren();buttons.forEach(([text,style,handler])=>{const b=document.createElement('button');b.textContent=text;b.className=style;b.onclick=handler;root.append(b)});$('modal').classList.remove('hidden')}function notice(text){modal('Сообщение',`<p>${text}</p>`)}function ask(title,text,yes){modal(title,`<p>${text}</p>`,[['Нет','light',closeModal],['Да','warn',()=>{closeModal();yes()}]])}
function load(){state=JSON.parse(localStorage.getItem('cafe-demo')||JSON.stringify(initial));state.orders.forEach(o=>{if(o.paid!==undefined){o.status=o.paid?'paid':'open';delete o.paid}})}function save(){localStorage.setItem('cafe-demo',JSON.stringify(state));}function orderFor(id){return state.orders.find(o=>o.tableId===id&&o.status==='open')}function total(o){return o.items.reduce((s,i)=>{const dish=state.menu.find(m=>m.id===i.menuId);return s+(i.price??dish?.price??0)*i.quantity},0)}
function renderTables(){const root=$('tables');root.replaceChildren();state.tables.forEach(t=>{const o=orderFor(t.id),el=document.createElement('div');el.className='table '+(selected===t.id?'active':'');el.innerHTML=`<div class="top"><b>${t.name}</b><span class="status ${o?'busy':''}">${o?'Заказ #'+o.id:'Свободен'}</span></div>`;el.onclick=()=>{selected=t.id;render()};root.append(el)})}
function renderMenu(){const root=$('menu');root.replaceChildren();state.menu.forEach(m=>{const el=document.createElement('div');el.className='dish';el.innerHTML=`<div class="top"><b>${m.name}</b><span class="price">${money(m.price)}</span></div><small>${m.category}</small>`;if(currentUser.role==='admin'){const actions=document.createElement('div');actions.className='actions';const edit=document.createElement('button'),remove=document.createElement('button');edit.textContent='Редактировать';edit.className='light';remove.textContent='Удалить';remove.className='warn';edit.onclick=e=>{e.stopPropagation();editDish(m)};remove.onclick=e=>{e.stopPropagation();removeDish(m)};actions.append(edit,remove);el.append(actions)}el.onclick=()=>addToOrder(m.id);root.append(el)})}
function renderOrder(){const root=$('order');root.replaceChildren();const table=state.tables.find(t=>t.id===selected);if(!table){root.innerHTML='<h2>Добро пожаловать!</h2><p class="empty">Выберите свободный стол, создайте заказ и добавьте блюда из меню.</p>';return}let o=orderFor(table.id);if(!o){root.innerHTML=`<div class="order-head"><div><h2>${table.name}</h2><p class="sub">Стол свободен</p></div></div><button id="createOrder">Создать заказ</button>`;$('createOrder').onclick=()=>{state.orders.push({id:Date.now(),tableId:table.id,items:[],status:'open',openedAt:Date.now()});save();render()};return}root.innerHTML=`<div class="order-head"><div><h2>${table.name}</h2><p class="sub">Заказ #${o.id.toString().slice(-4)} · Официант: Анна</p></div><span class="status busy">Открыт</span></div>`;if(!o.items.length)root.innerHTML+='<p class="empty">Добавьте блюда из меню слева.</p>';o.items.forEach(i=>{const m=state.menu.find(x=>x.id===i.menuId),el=document.createElement('div');el.className='order-item';el.innerHTML=`<div class="top"><b>${m.name}</b><b>${money(m.price*i.quantity)}</b></div><div class="quantity"><button>−</button><span>${i.quantity} × ${money(m.price)}</span><button>+</button></div>`;const [minus,plus]=el.querySelectorAll('button');minus.onclick=()=>changeQty(o,i,-1);plus.onclick=()=>changeQty(o,i,1);root.append(el)});root.innerHTML+=`<div class="total"><span>Итого</span><span>${money(total(o))}</span></div><div class="actions"><button id="pay">Оплатить картой</button><button id="cash" class="light">Наличные</button><button id="cancel" class="warn">Отменить заказ</button></div>`;$('pay').onclick=()=>pay(o,'картой');$('cash').onclick=()=>pay(o,'наличными');$('cancel').onclick=()=>{if(confirm('Отменить этот заказ?')){o.status='cancelled';o.closedAt=Date.now();save();render()}}}
function addToOrder(menuId){const o=orderFor(selected);if(!o)return notice('Сначала выберите стол и создайте заказ.');const i=o.items.find(x=>x.menuId===menuId);if(i)i.quantity++;else o.items.push({menuId,quantity:1,price:state.menu.find(m=>m.id===menuId).price});save();renderOrder();renderTables()}function changeQty(o,i,d){i.quantity+=d;if(i.quantity<1)o.items=o.items.filter(x=>x!==i);save();render()}function pay(o,method){if(!o.items.length)return notice('Добавьте хотя бы одно блюдо.');ask('Подтверждение оплаты',`Принять ${money(total(o))} ${method}?`,()=>{o.status='paid';o.method=method;o.closedAt=Date.now();save();render();notice('Оплата принята. Стол снова свободен.')})}
function editDish(m){modal('Редактировать блюдо',`<label>Название</label><input id="editName" value="${m.name}"><label>Цена, сом</label><input id="editPrice" type="number" min="0" value="${m.price}"><label>Категория</label><input id="editCategory" value="${m.category}">`,[['Отмена','light',closeModal],['Сохранить','',()=>{const name=$('editName').value.trim(),price=Number($('editPrice').value),category=$('editCategory').value.trim();if(!name||!Number.isFinite(price)||price<0)return notice('Введите корректные название и цену.');m.name=name;m.price=price;m.category=category||'Без категории';save();closeModal();render()}]])}function removeDish(m){const used=state.orders.some(o=>o.status==='open'&&o.items.some(i=>i.menuId===m.id));if(used)return notice('Нельзя удалить блюдо: оно есть в открытом заказе.');ask('Удаление блюда',`Удалить «${m.name}» из меню?`,()=>{state.menu=state.menu.filter(x=>x!==m);save();renderMenu()})}
function formatDate(value){return value?new Date(value).toLocaleString('ru-RU',{dateStyle:'short',timeStyle:'short'}):'—'}function showHistory(){selected=null;renderTables();renderMenu();const root=$('order');root.innerHTML='<h2>История заказов</h2><p class="sub">Оплаченные и отменённые заказы</p>';const closed=state.orders.filter(o=>o.status!=='open').sort((a,b)=>(b.closedAt||0)-(a.closedAt||0));if(!closed.length){root.innerHTML+='<p class="empty">Закрытых заказов пока нет.</p>';return}closed.forEach(o=>{const table=state.tables.find(t=>t.id===o.tableId);const status=o.status==='paid'?'Оплачен':'Отменён';root.innerHTML+=`<div class="order-item"><div class="top"><b>${table?.name||'Удалённый стол'} · #${String(o.id).slice(-4)}</b><span class="status ${o.status==='paid'?'':'busy'}">${status}</span></div><small>${formatDate(o.closedAt)} · ${o.status==='paid'?money(total(o)):'Без оплаты'}</small></div>`})}function showReports(){selected=null;renderTables();renderMenu();const root=$('order'),paid=state.orders.filter(o=>o.status==='paid'),revenue=paid.reduce((s,o)=>s+total(o),0),average=paid.length?revenue/paid.length:0,cancelled=state.orders.filter(o=>o.status==='cancelled').length;root.innerHTML=`<h2>Отчёт</h2><p class="sub">По всем данным демо-версии</p><div class="order-item"><div class="top"><b>Выручка</b><b>${money(revenue)}</b></div></div><div class="order-item"><div class="top"><b>Оплачено заказов</b><b>${paid.length}</b></div></div><div class="order-item"><div class="top"><b>Средний чек</b><b>${money(average)}</b></div></div><div class="order-item"><div class="top"><b>Отменено заказов</b><b>${cancelled}</b></div></div>`}
function render(){renderTables();renderMenu();renderOrder();document.querySelectorAll('.admin-only').forEach(el=>el.classList.toggle('hidden',currentUser?.role!=='admin'));if(currentUser?.role==='waiter')document.querySelectorAll('#pay,#cash,#cancel').forEach(el=>el.classList.add('hidden'))}$('signIn').onclick=()=>{const accounts={admin:{password:'admin',name:'Администратор',role:'admin'},waiter:{password:'waiter',name:'Официант Анна',role:'waiter'}},account=accounts[$('login').value.trim().toLowerCase()];if(account&&$('password').value===account.password){currentUser={login:$('login').value.trim().toLowerCase(),...account};$('user').textContent=currentUser.name+' · '+currentUser.role;$('loginView').classList.add('hidden');$('app').classList.remove('hidden');load();render()}else $('loginError').textContent='Проверьте логин и пароль'};$('logout').onclick=()=>location.reload();$('reset').onclick=()=>{localStorage.removeItem('cafe-demo');load();selected=null;render()};$('history').onclick=showHistory;$('reports').onclick=showReports;$('addTable').onclick=()=>{const name=$('newTable').value.trim();if(!name)return;state.tables.push({id:Date.now(),name});$('newTable').value='';save();renderTables()};$('addDish').onclick=()=>{const name=$('newDish').value.trim(),price=Number($('newPrice').value);if(!name||!price)return notice('Введите название и цену');state.menu.push({id:Date.now(),name,price,category:'Новое'});$('newDish').value=$('newPrice').value='';save();renderMenu()};document.addEventListener('click',event=>{if(event.target.id!=='cancel')return;event.stopImmediatePropagation();event.preventDefault();const order=orderFor(selected);if(order)ask('Отмена заказа','Отменить этот заказ?',()=>{order.status='cancelled';order.closedAt=Date.now();save();render()})},true);
</script></body></html>
